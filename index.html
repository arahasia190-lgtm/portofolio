<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/foto.webp" as="image" type="image/webp" fetchpriority="high" />
    <!--content-meta-->
    <script>
      (function () {
        var d = document.documentElement;
        var t = null;
        try { t = localStorage.getItem("tema"); } catch (e) {}
        if (t !== "terang" && t !== "gelap") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "gelap" : "terang";
        }
        d.dataset.theme = t;
        var seen = null;
        try { seen = sessionStorage.getItem("intro-selesai"); } catch (e) {}
        if (!seen) d.classList.add("has-intro");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
